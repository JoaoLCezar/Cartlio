services:
  web:
    build:
      context: .
      target: development
    env_file:
      - path: .env.local
        required: false
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${QUADRICS_DOCKER_SUPABASE_URL:-${CARTLIO_DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}}

volumes:
  node_modules:
  next_cache:
